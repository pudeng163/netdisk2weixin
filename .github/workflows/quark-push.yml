name: Quark Auto Push
on:
  schedule:
    - cron: '0 0-13 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .env from Secrets
        run: |
          echo "COUNT=6" > .env
          echo "CACHE_EXPIRE_HOURS=12" >> .env
          echo "TARGET_FOLDER=下载" >> .env
          echo "WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}" >> .env
          echo "BAIDU_COOKIE=${{ secrets.BAIDU_COOKIE }}" >> .env
          echo "QUARK_COOKIE=${{ secrets.QUARK_COOKIE }}" >> .env
          echo "KUAKE_COOKIE=${{ secrets.KUAKE_COOKIE }}" >> .env
          echo "QUARK_FOLDER_FID=${{ secrets.QUARK_FOLDER_FID }}" >> .env
          echo "QUARK_YINLIU_PDF=assets/333333.pdf" >> .env
          echo "QUARK_YINLIU_PROBABILITY=1.0" >> .env
          echo "QUARK_YINLIU_SUBDIR=自动转存" >> .env

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Push 6 小学资料
        run: python main.py quark --count 6 --include 小学 --force
