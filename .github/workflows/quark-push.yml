name: Quark Auto Push

on:
  schedule:
    - cron: '11 16 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '推送数量'
        required: false
        default: '6'
      exclude:
        description: '排除关键词（空格分隔）'
        required: false
        default: '短剧'

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .env from Secrets
        shell: bash
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          BAIDU_COOKIE: ${{ secrets.BAIDU_COOKIE }}
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          KUAKE_COOKIE: ${{ secrets.KUAKE_COOKIE }}
          QUARK_FOLDER_FID: ${{ secrets.QUARK_FOLDER_FID }}
        run: |
          cat > .env <<EOF
          COUNT=${COUNT:-6}
          CACHE_EXPIRE_HOURS=12
          TARGET_FOLDER=下载
          LOCAL_POOL_ENABLED=true
          RESOURCE_POOL_FILE=资源池.json
          WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
          BAIDU_COOKIE=${BAIDU_COOKIE}
          QUARK_COOKIE=${QUARK_COOKIE}
          KUAKE_COOKIE=${KUAKE_COOKIE}
          QUARK_FOLDER_FID=${QUARK_FOLDER_FID}
          QUARK_YINLIU_PDF=assets/99999.pdf
          QUARK_YINLIU_PROBABILITY=1.0
          QUARK_YINLIU_SUBDIR=自动转存
          EOF
          echo "已生成 .env"

      - name: Ensure kuake CLI exists
        shell: bash
        run: |
          CLI=assets/bin/kuake-v1.5.0-linux-amd64
          if [ ! -f "$CLI" ]; then
            echo "::error::$CLI not found. Please commit the linux build into assets/bin/."
            exit 1
          fi
          chmod +x "$CLI"
          echo "kuake CLI OK: $(stat -c%s "$CLI") bytes"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Smoke test (import + 资源池读取)
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0,'.'); import main; print('main import OK')"
          python -c "import sys; sys.path.insert(0,'.'); from core import cache; items = cache.load_local_pool('quark') or []; print(f'资源池载入 {len(items)} 条')"

      - name: Unit tests
        shell: bash
        run: python -m pytest tests/ -q

      - name: Diagnose (平台 → 二进制自动识别)
        shell: bash
        run: python main.py diagnose || true

      - name: Push resources
        shell: bash
        env:
          COUNT: ${{ github.event.inputs.count || '6' }}
          EXCLUDE: ${{ github.event.inputs.exclude || '短剧' }}
        run: |
          # PanSou 未启动时预检自动 fail-open，不影响推送
          python main.py quark --count "$COUNT" --exclude $EXCLUDE
