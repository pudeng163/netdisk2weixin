# 网盘拉新统一配置样例
# 复制本文件为 config.yaml 并填写实际值；config.yaml 已被 .gitignore 忽略。
# 也可以改用 .env（字段名兼容旧项目），环境变量优先级高于 yaml。

# 全局默认
count: 5                  # 每次转存资源数量（各平台可覆盖）
cache_expire_hours: 24    # API 缓存过期时间（小时）
target_folder: 转存资源     # 百度网盘目标文件夹

wechat:
  webhook_url: ""          # 企业微信机器人 webhook 地址

baidu:
  cookie: ""               # 百度网盘 Cookie（F12 -> Network 获取）
  # count: 10              # 可覆盖全局 count
  # target_folder: 下载     # 可覆盖全局 target_folder

quark:
  cookie: ""               # 夸克网盘 Cookie（可选，浏览器登录后自动保存到 data/ 或 config）
  # count: 10              # 可覆盖全局 count
  # kuake_cli: ""          # kuake CLI 路径，留空则按操作系统自动选择
                           # Windows: assets/bin/kuake-v1.5.0-windows-amd64.exe
                           # Linux:   assets/bin/kuake-v1.5.0-linux-amd64
  # 转存目标文件夹 fid（默认 "0" 即根目录）
  # 例：folder_fid: "0df18b5a1b264b86a1c46ae5d9ebc748"
  folder_fid: "0"
  yinliu_pdf: "assets/333333.pdf"                     # 引流 PDF 文件
  yinliu_probability: 0.0                             # 引流文件添加概率 0~1
  # 引流 PDF 上传子目录（在分享文件夹路径前加的前缀）
  # 例如设置为 "自动转存"，则上传到 /自动转存/{title}/333333.pdf
  yinliu_subdir: "自动转存"
